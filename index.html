<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f1115" />
  <title>Jimmy Nguyen · Software Engineer</title>
  <meta name="description" content="Jimmy Nguyen — software engineer. Projects, experience and contact." />
  <meta property="og:title" content="Jimmy Nguyen · Software Engineer" />
  <meta property="og:description" content="Projects, experience and contact." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://jimmynguyen0313.github.io/" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#projects">Skip to projects</a>

  <header class="nav">
    <div class="nav__inner">
      <a class="nav__brand" href="#top" id="brand"></a>
      <nav class="nav__links" aria-label="Sections">
        <a href="#projects">Projects</a>
        <a href="#experience">Experience</a>
        <a href="#contact">Contact</a>
        <a href="assets/Jimmy_Nguyen_Resume.pdf" target="_blank" rel="noopener">Resume</a>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch between dark and light mode">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main id="top">
    <!-- About -->
    <section class="hero">
      <div class="hero__inner">
        <div class="hero__avatar" id="avatar" aria-hidden="true"></div>
        <p class="eyebrow" id="hero-eyebrow"></p>
        <h1 class="hero__name">Hi, I'm <span id="hero-name"></span>.</h1>
        <div class="hero__bio" id="hero-bio"></div>
        <div class="hero__links" id="hero-links"></div>
      </div>
      <a class="scroll-cue" href="#projects" aria-label="Scroll to projects">
        <span>Projects</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </a>
    </section>

    <!-- Projects -->
    <section class="section" id="projects">
      <div class="section__inner">
        <h2 class="section__title"><span class="mono">01</span> Projects</h2>
        <div class="projects" id="project-list"></div>
      </div>
    </section>

    <!-- Experience -->
    <section class="section section--alt" id="experience">
      <div class="section__inner">
        <h2 class="section__title"><span class="mono">02</span> Experience</h2>
        <div class="timeline" id="experience-list"></div>

        <h3 class="subhead">Education</h3>
        <div class="edu" id="education-list"></div>

        <h3 class="subhead">Skills</h3>
        <div class="skills" id="skills-list"></div>
      </div>
    </section>

    <!-- Contact -->
    <section class="section contact" id="contact">
      <div class="section__inner">
        <h2 class="section__title"><span class="mono">03</span> Get in touch</h2>
        <p class="contact__text">I'm always happy to talk about software, AI, or an opportunity. The quickest way to reach me is email.</p>
        <div class="hero__links" id="contact-links"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>© <span id="year"></span> <span id="footer-name"></span></p>
  </footer>

  <!-- Image viewer -->
  <dialog class="lightbox" id="lightbox" aria-label="Screenshot">
    <button class="lightbox__close" type="button" aria-label="Close">×</button>
    <img alt="" />
    <p class="lightbox__caption"></p>
  </dialog>

  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
